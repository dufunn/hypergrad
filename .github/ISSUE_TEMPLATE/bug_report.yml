name: Bug report
description: Report a reproducible product or engineering defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real applicant data, credentials, invite codes, or private recruitment content.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest sequence of steps and use fictional data where possible.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Workspace mode
      options:
        - Demo sandbox
        - Local workspace
        - Cloud workspace
        - Self-hosted deployment
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 126 on macOS 15
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots are welcome after removing personal information.
